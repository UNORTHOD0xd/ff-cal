name: Build calendar

on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours (UTC), off the top of the hour
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: build-calendar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build USD calendar
        run: node scripts/build-ics.mjs docs/usd.ics

      # Commit only when the calendar actually changed. Regular commits also
      # keep GitHub from pausing the schedule after 60 days of inactivity.
      - name: Commit if changed
        run: |
          git add docs/usd.ics
          if git diff --cached --quiet; then
            echo "No changes to calendar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update USD calendar"
          git push
